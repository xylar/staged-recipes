{% set name = "apache-airflow-providers-common-messaging" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/apache_airflow_providers_common_messaging-{{ version }}.tar.gz
  sha256: 611618cfc21c03a7c48d747911fddea230634ecd1d8ff2edab91c76447ef4988

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min}}
    - flit-core ==3.12.0
    - pip
  run:
    - python >={{ python_min}}
    - apache-airflow >=3.0.1

test:
  imports:
    - .airflow.providers.common.messaging
  commands:
    - pip check
  requires:
    - python {{ python_min}}
    - pip

about:
  home: https://github.com/apache/airflow/
  summary: Provider package apache-airflow-providers-common-messaging for Apache Airflow
  license: Apache-2.0
  license_file: src/airflow/providers/common/messaging/LICENSE
  license_family: Apache
  doc_url: https://airflow.apache.org/docs/apache-airflow-providers-common-messaging/stable/index.html
  dev_url: https://github.com/apache/airflow/

extra:
  recipe-maintainers:
    - xylar
